<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="62%">
      <stop offset="0%"   stop-color="#fffde7"/>
      <stop offset="55%"  stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- 圆角紫色背景 -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>

  <!-- 光芒射线 (5 条，上半部分对称分布) -->
  <g stroke="#fde68a" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
    <line x1="32" y1="5"  x2="32" y2="11"/>
    <line x1="16" y1="11" x2="20" y2="15"/>
    <line x1="48" y1="11" x2="44" y2="15"/>
    <line x1="8"  y1="24" x2="14" y2="26"/>
    <line x1="56" y1="24" x2="50" y2="26"/>
  </g>

  <!-- 灯泡玻璃球体 (梨形) -->
  <path d="M32 13
    C19 13 16 22 16 29
    C16 36 20 41 27 43.5
    L27 46 L37 46 L37 43.5
    C44 41 48 36 48 29
    C48 22 45 13 32 13 Z"
    fill="url(#glow)"/>

  <!-- 内部高光 (增强点亮感) -->
  <ellipse cx="27.5" cy="24" rx="4.5" ry="3.5" fill="rgba(255,255,255,0.32)"/>

  <!-- 灯头螺纹底座 (3 段递缩) -->
  <rect x="25"   y="46"  width="14" height="3.5" rx="1"   fill="#fde68a"/>
  <rect x="26"   y="49.5" width="12" height="3.5" rx="1"  fill="#f59e0b"/>
  <rect x="27.5" y="53"  width="9"  height="3.5" rx="1.5" fill="#d97706"/>
</svg>
